name: organize-repo

# 整理 release 资产，生成 apt + pip 索引部署到 gh-pages
#
# 触发方式:
#   1. workflow_dispatch（手动）—— 仓库 owner 在 Actions 页面 Run workflow
#   2. repository_dispatch（自动）—— bootstrap CI 发版后调用
#      bootstrap CI 调用方式:
#        gh api repos/XION-HN/haisa-des-repo/dispatches \
#          -f event_type=organize-repo \
#          -f client_payload[release_tag]=v0.5.0
#
# 整理流程（全量重建 + 并行扫描）:
#   1. 扫描所有 release（pip-a ~ pip-z，并行 8 并发）
#   2. 全量重建 gh-pages 索引（apt-repo/ + pip-repo/）
#   3. 清空 gh-pages 旧内容，部署新索引
#
# Release 布局:
#   固定 26 个 tag: pip-a / pip-b / ... / pip-z
#   bootstrap CI 上传资产时按首字母归到对应 release

on:
  push:
    branches: [main]
    paths:
      - 'scripts/organize-repo.sh'
      - '.github/workflows/organize.yml'
  workflow_dispatch:
    inputs:
      sign_release:
        description: '是否 GPG 签名 apt Release（需 Secret HAISADES_GPG_PRIVATE_KEY）'
        required: false
        type: boolean
        default: false
      keep_old_gh_pages:
        description: '保留 gh-pages 现有非 apt-repo/pip-repo 文件'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [organize-repo]

permissions:
  contents: write   # push gh-pages
  actions: read    # 读 release 列表

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnupg python3 git curl jq
          gh --version || echo "gh CLI 缺失"

      - name: Show trigger info
        env:
          EVENT_TYPE: ${{ github.event.action }}
          CLIENT_TAG: ${{ github.event.client_payload.release_tag }}
        run: |
          echo "触发方式: ${EVENT_TYPE:-workflow_dispatch}"
          echo "客户端 payload release_tag: ${CLIENT_TAG:-（无）}"
          echo "GITHUB_REF: $GITHUB_REF"

      - name: Run organize-repo.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          ./scripts/organize-repo.sh

      - name: Sign Release (optional)
        if: ${{ github.event.inputs.sign_release == 'true' }}
        env:
          HAISADES_GPG_PRIVATE_KEY: ${{ secrets.HAISADES_GPG_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$HAISADES_GPG_PRIVATE_KEY" ]; then
            echo "::warning::secrets.HAISADES_GPG_PRIVATE_KEY 未配置，跳过签名"
            exit 0
          fi
          git clone --quiet --depth 1 \
            https://github.com/XION-HN/haisa-des-bootstrap.git /tmp/bootstrap-repo
          printf '%s' "$HAISADES_GPG_PRIVATE_KEY" | /tmp/bootstrap-repo/build-system/make-keyring.sh import-private
          /tmp/bootstrap-repo/build-system/make-keyring.sh sign dist/apt-repo/dists/stable/Release
          rm -rf /tmp/bootstrap-repo

      - name: Upload organize report
        uses: actions/upload-artifact@v4
        with:
          name: organize-report
          path: dist/organize-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "haisa-des-ci"
          git config --global user.email "ci@haisa-des.local"

          CLONE_DIR="$(mktemp -d)"
          if ! git clone --quiet --depth 1 --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "$CLONE_DIR" 2>/dev/null; then
            git clone --quiet --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "$CLONE_DIR"
            cd "$CLONE_DIR"
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            cd - >/dev/null
          fi

          cd "$CLONE_DIR"

          KEEP_OLD="${{ github.event.inputs.keep_old_gh_pages }}"
          if [ "$KEEP_OLD" != "true" ]; then
            echo "清空旧 gh-pages 内容（保留 .git）..."
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          cp -r "$GITHUB_WORKSPACE/dist/apt-repo" ./apt-repo
          cp -r "$GITHUB_WORKSPACE/dist/pip-repo" ./pip-repo

          printf '%s\n' \
            "# haisa-des repository (gh-pages)" \
            "" \
            "Auto-organized by organize-repo.yml workflow." \
            "Last run: $(date -u +%Y-%m-%dT%H:%M:%SZ) (run #$GITHUB_RUN_ID)" \
            "" \
            "## Layout" \
            "" \
            "- \`apt-repo/\` — Debian package repository" \
            "- \`pip-repo/\` — PEP 503 Python simple index" \
            "" \
            "## Sources" \
            "" \
            "- Release assets: https://github.com/${{ github.repository }}/releases" \
            "- Build system: https://github.com/XION-HN/haisa-des-bootstrap" \
            > README.md

          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages 无变化，跳过 push"
          else
            DEB_COUNT=$(find apt-repo -name '*.deb' 2>/dev/null | wc -l)
            WHL_COUNT=$(find pip-repo -name '*.whl' 2>/dev/null | wc -l)
            git commit -m "chore(gh-pages): organize all release assets

          - Triggered by: ${{ github.event_name }}
          - apt-repo: ${DEB_COUNT} debs indexed
          - pip-repo: ${WHL_COUNT} wheels indexed"
            git push --quiet origin gh-pages
            echo "✓ gh-pages 已部署"
          fi

          cd - >/dev/null
          rm -rf "$CLONE_DIR"
