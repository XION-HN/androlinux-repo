name: organize-repo

# 手动触发的整理脚本：扫描本仓库所有 Release 资产，按首字母归档到 gh-pages 分支
# 用途:
#   1. 历史资产迁移（v0.1.4/v0.2.0/v0.3.0 等老 release 的 .deb/.whl 也按首字母归档）
#   2. CI 出 bug 后的修复整理（手动重跑）
#   3. 全量重生成 Packages/Release/InRelease 元数据
#
# 触发: workflow_dispatch（仓库 owner 在 Actions 页面手动 Run workflow）
#       可选参数 SIGN_RELEASE: 是否签名 Release（需 haisa-des-bootstrap Secret HAISADES_GPG_PRIVATE_KEY
#       在本仓库也注入同名的 Secret）

on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: '是否 GPG 签名 Release（InRelease + Release.gpg）'
        required: false
        type: boolean
        default: false
      keep_old_gh_pages:
        description: '保留 gh-pages 现有非 apt-repo/pip-repo 文件（如已存在的 README）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 需写 gh-pages 分支
  actions: read      # 需读 release 列表

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gnupg python3 git curl jq
          gh --version || echo "gh CLI 缺失（actions 环境应自带）"

      - name: Run organize-repo.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # GITHUB_TOKEN 默认有 contents:read + actions:read，足够扫描 releases
          # 但 push gh-pages 需要 contents:write（permissions 已配置）
          ./scripts/organize-repo.sh

      - name: Sign Release (optional)
        if: ${{ inputs.sign_release }}
        env:
          HAISADES_GPG_PRIVATE_KEY: ${{ secrets.HAISADES_GPG_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$HAISADES_GPG_PRIVATE_KEY" ]; then
            echo "::warning::secrets.HAISADES_GPG_PRIVATE_KEY 未配置，跳过签名"
            exit 0
          fi
          # 复用 haisa-des-bootstrap 的 make-keyring.sh（clone 浅拷贝）
          git clone --quiet --depth 1 \
            https://github.com/XION-HN/haisa-des-bootstrap.git /tmp/bootstrap-repo
          printf '%s' "$HAISADES_GPG_PRIVATE_KEY" | /tmp/bootstrap-repo/build-system/make-keyring.sh import-private
          /tmp/bootstrap-repo/build-system/make-keyring.sh sign dist/apt-repo/dists/stable/Release
          rm -rf /tmp/bootstrap-repo

      - name: Upload organize report artifact
        uses: actions/upload-artifact@v4
        with:
          name: organize-report
          path: dist/organize-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "haisa-des-ci"
          git config --global user.email "ci@haisa-des.local"

          CLONE_DIR="$(mktemp -d)"
          # 浅克隆 gh-pages（若不存在，创建 orphan 分支）
          if ! git clone --quiet --depth 1 --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "$CLONE_DIR" 2>/dev/null; then
            git clone --quiet --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "$CLONE_DIR"
            cd "$CLONE_DIR"
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            cd - >/dev/null
          fi

          cd "$CLONE_DIR"

          KEEP_OLD="${{ inputs.keep_old_gh_pages }}"
          if [ "$KEEP_OLD" != "true" ]; then
            echo "清空旧 gh-pages 内容（保留 .git）..."
            # 不动 .git，删除其他所有文件
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          # 拷新构建的 apt-repo/ 和 pip-repo/
          cp -r "$GITHUB_WORKSPACE/dist/apt-repo" ./apt-repo
          cp -r "$GITHUB_WORKSPACE/dist/pip-repo" ./pip-repo

          # 顶层 README（用 printf 避免 YAML 缩进污染内容）
          printf '%s\n' \
            "# haisa-des repository (gh-pages)" \
            "" \
            "Auto-organized from GitHub Releases by organize-repo.yml workflow." \
            "Last run: $(date -u +%Y-%m-%dT%H:%M:%SZ) (run #$GITHUB_RUN_ID)" \
            "" \
            "## Layout" \
            "" \
            "- \`apt-repo/\` — Debian package repository" \
            "  - \`dists/stable/Release\` (+ InRelease / Release.gpg if signed)" \
            "  - \`dists/stable/main/binary-aarch64/Packages\` (+ .gz)" \
            "  - \`pool/main/<首字母>/<包名>/<deb>\`" \
            "" \
            "- \`pip-repo/\` — PEP 503 Python simple index" \
            "  - \`simple/index.html\`" \
            "  - \`simple/<首字母>/<规范化包名>/index.html\` + wheel files" \
            "" \
            "## Sources" \
            "" \
            "- Release assets: https://github.com/${{ github.repository }}/releases" \
            "- Build system: https://github.com/XION-HN/haisa-des-bootstrap" \
            > README.md

          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages 无变化，跳过 push"
          else
            DEB_COUNT=$(find apt-repo -name '*.deb' | wc -l)
            WHL_COUNT=$(find pip-repo -name '*.whl' | wc -l)
            git commit -m "chore(gh-pages): organize all release assets

          - Triggered by: workflow_dispatch (run #$GITHUB_RUN_ID)
          - apt-repo: ${DEB_COUNT} debs
          - pip-repo: ${WHL_COUNT} wheels"
            git push --quiet origin gh-pages
            echo "✓ gh-pages 已部署"
          fi

          cd - >/dev/null
          rm -rf "$CLONE_DIR"
