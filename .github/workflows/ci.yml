name: ci

on:
  push:
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # 交叉编译：NDK r29 构建 13 个包（含 Python 3.13 + pip）→ bootstrap zip + 单包 tar.gz
  # prod = 正式 prefix（打进 APK）；test = Termux 冒烟 prefix
  # -----------------------------------------------------------
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r29
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865"

      - name: Build all packages
        env:
          VARIANT: ${{ matrix.variant }}
          JOBS: 4
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cd build-system
          ./build.sh build all
          ./make-bootstrap.sh

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.variant }}
          path: |
            build-system/dist/*.zip
            build-system/dist/packages/*.tar.gz
          retention-days: 30

  # -----------------------------------------------------------
  # APK：注入 prod bootstrap 资产 → assembleDebug（侧载分发）
  # -----------------------------------------------------------
  apk:
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Inject prod bootstrap asset
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-prod
          path: /tmp/bootstrap

      - name: Place asset
        run: |
          ls -la /tmp/bootstrap/
          mkdir -p app/src/main/assets/bootstrap
          cp /tmp/bootstrap/bootstrap-arm64-v8a.zip app/src/main/assets/bootstrap/
          ls -la app/src/main/assets/bootstrap/

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androlinux-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
